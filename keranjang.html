<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - PelitaRental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard-user.html">PelitaRental</a>
      <div class="d-flex gap-2">
        <button id="darkToggle" class="btn btn-outline-secondary btn-sm" type="button">Mode Gelap</button>
        <a href="dashboard-user.html" class="btn btn-outline-primary btn-sm">Dashboard</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 fw-bold mb-1">Keranjang</h1>
    <p class="text-muted mb-4">Atur jumlah unit, lalu lanjut ke booking.</p>

    <div id="keranjangKosong" class="alert alert-light border d-none">
      Keranjang masih kosong. <a href="dashboard-user.html#katalog">Pilih alat dari katalog</a>.
    </div>

    <div class="card mb-3" id="kartuKeranjang">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Alat</th>
              <th>Harga / hari</th>
              <th style="width:120px">Jumlah</th>
              <th class="text-end">Subtotal / hari</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="isiKeranjang"></tbody>
        </table>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div>
        <span class="text-muted">Total per hari:</span>
        <strong class="h5 ms-2 mb-0" id="totalPerHari">Rp 0</strong>
      </div>
      <a href="form.html" class="btn btn-primary" id="lanjut">Lanjut ke Booking</a>
    </div>
  </main>

  <footer class="text-center text-muted py-3 border-top mt-4">
    PelitaRental &middot; Yogyakarta
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/keranjang.js"></script>
</body>
</html>
