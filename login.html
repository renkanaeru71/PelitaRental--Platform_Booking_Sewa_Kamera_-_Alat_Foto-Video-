<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - PelitaRental</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

  <main class="container">
    <div class="card card-auth shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-3">Selamat datang di PelitaRental</h1>

        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabLogin" type="button" role="tab">Login</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabDaftar" type="button" role="tab">Daftar</button>
          </li>
        </ul>

        <div class="tab-content">

          <!-- LOGIN -->
          <div class="tab-pane fade show active" id="tabLogin" role="tabpanel">
            <form action="dashboard-user.html" method="get">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" id="loginPassword" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
          </div>

          <!-- DAFTAR -->
          <div class="tab-pane fade" id="tabDaftar" role="tabpanel">
            <form action="dashboard-user.html" method="get">
              <div class="mb-3">
                <label for="daftarNama" class="form-label">Nama Lengkap</label>
                <input type="text" id="daftarNama" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="daftarEmail" class="form-label">Email</label>
                <input type="email" id="daftarEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="daftarHp" class="form-label">No. HP</label>
                <input type="tel" id="daftarHp" class="form-control" required>
              </div>
              <div class="mb-3">
                <label for="daftarPassword" class="form-label">Password (min. 6 karakter)</label>
                <input type="password" id="daftarPassword" class="form-control" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Daftar</button>
            </form>
          </div>

        </div>

        <p class="text-center small text-muted mt-3 mb-0">
          <a href="index.html">Kembali ke katalog</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
